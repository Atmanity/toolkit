  /v1/avatar_sessions:
    post:
      tags: [Avatar sessions]
      summary: Render an avatar into your own LiveKit room (API-key authenticated)
      description: |
        Starts an **avatar session**: the avatar is rendered into a LiveKit room
        that YOU own, on behalf of YOUR agent — the bring-your-own-agent path the
        `livekit-plugins-atmee` plugin uses. Nothing here creates a room or a
        conversation: you mint a LiveKit access token for the avatar participant
        with your own project's API secret (grant `roomJoin` for your room, set the
        participant attribute `lk.publish_on_behalf` to your agent's identity, and
        `kind: agent`) and pass it here. The rendering worker joins your room with
        that token, waits for your agent, receives its audio over the LiveKit data
        stream (`lk.audio_stream`, 16 kHz PCM — livekit-agents'
        `DataStreamAudioOutput`) and publishes synced video and audio.

        Responds `202` as soon as the worker acknowledged the start (`status:
        initializing`), typically within a second; the avatar's tracks appear in
        your room a few seconds later. Pass `?waitFor=avatar_joined` to block
        until the worker is in the room instead. Billing runs by the minute while
        the render lasts and stops when the worker reports the end (your agent
        left, the room closed, you removed the avatar participant), when you call
        `POST /v1/avatar_sessions/{id}/end`, or at `maxDurationSeconds`.

        The token is read, not verified — your secret never leaves you. A token
        your LiveKit server rejects simply never joins and the session fails as
        `AVATAR_DID_NOT_JOIN` after the join timeout.

        **Atmee-hosted room** (no LiveKit project of your own, e.g. a Pipecat
        bot on any transport): omit both `livekitUrl` and `livekitToken`. The
        service then creates a room on Atmee's LiveKit project, the avatar joins
        it as `atmee-avatar-agent` publishing on behalf of `agentIdentity`
        (default `agent`), and the response carries `livekitUrl` and
        `agentToken` for your agent to join that room with. The protocol inside
        the room is the same: stream your agent's audio to the avatar
        (`lk.audio_stream`), subscribe to the avatar's video and audio tracks.
        The room is deleted when the session ends. Requires the `sessions`
        scope; the avatar must be on the key's allow-list.

        **v2 avatars** (invite-only) render on a separate GPU pool: the avatar's
        own configuration decides, there is nothing to set on the request. That
        pool scales to zero, so the first v2 session after a quiet period can
        take a few minutes to start: the service waits up to 4 minutes for the
        pool to start the render and up to 6 for the avatar to join. Use
        `?waitFor=avatar_joined` with a client timeout of at least 7 minutes, or
        retry on `avatar_warming`.
      operationId: startAvatarSession
      security:
        - apiKeyAuth: []
      parameters:
        - name: waitFor
          in: query
          required: false
          description: |
            `initializing` (default) returns once the worker acknowledged the
            start; `avatar_joined` returns once the avatar participant is in
            your room.
          schema:
            type: string
            enum: [initializing, avatar_joined]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvatarSessionStartRequest'
      responses:
        '202':
          description: The avatar is starting (or has joined, with `waitFor=avatar_joined`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarSessionCreateResponse'
        '400':
          description: |
            `invalid_request` (only one of `livekitUrl` / `livekitToken` sent),
            `invalid_livekit_url` (not a ws(s):// server URL),
            `invalid_livekit_token` (not a LiveKit access token, no room grant, or
            expired), `missing_publish_on_behalf` (the token names no agent to
            render for), `agent_identity_mismatch` (`agentIdentity` differs from
            the token's `lk.publish_on_behalf`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Missing or invalid API key (a user token is refused here)
        '402':
          description: Out of credits, this key's spend cap was reached, or too many sessions at once for this key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequiredResponse'
        '403':
          description: '`avatar_not_allowed` — the avatar is not on this key''s allow-list'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: '`avatar_not_renderable` — the avatar has nothing to render: no reference image (v1) and no v2 bundle | `avatar_busy` — the rendering capacity refused the start while the avatar is in another live session of this account (`liveSessionId` when it is an API session: end it with `POST /v1/avatar_sessions/{id}/end`, or retry once it has ended); nothing is billed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Request body failed schema validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrameworkErrorResponse'
        '502':
          description: |
            `avatar_start_failed` — the rendering worker refused the render before
            the avatar joined (for example the portrait could not be cropped to a
            face). `message` carries the worker's text. Nothing is billed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          description: |
            `no_capacity` — every rendering worker is busy; retry after the
            `Retry-After` seconds. `avatar_warming` — a v2 avatar is being
            prepared on a rendering node; retry after the `Retry-After` seconds
            (nothing is billed). `avatar_start_interrupted` — the rendering worker
            accepted the start, but it ended before the avatar joined your room;
            nothing is billed, retry after the `Retry-After` seconds.
            `avatar_version_unavailable` — the avatar is a v2 avatar and this
            deployment renders v1 only.
            `avatar_sessions_disabled` — this deployment has no rendering
            backend configured. `hosted_room_unavailable` — `livekitUrl` and
            `livekitToken` were omitted and this deployment cannot host a room. `embed_disabled` — API-key sessions are
            switched off.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying (`no_capacity`, `avatar_warming` and `avatar_start_interrupted`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

