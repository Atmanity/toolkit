        '403':
          description: insufficient_scope | avatar_not_allowed | account_not_allowed (a user token whose X-Account-Id names an account the user may not act for) | v2_access_required (engine v2 is invite-only and this account has not been let in yet)
        '404':
          description: avatar_not_found
        '409':
          description: upload_not_ready | upload_consumed | upload_expired | upload_in_use | account_ambiguous (a user token of several accounts without X-Account-Id)
        '413':
