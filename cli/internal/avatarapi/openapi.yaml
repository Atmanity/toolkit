    AvatarVoice:
      allOf:
        - $ref: '#/components/schemas/AvatarSourceFile'
        - $ref: '#/components/schemas/AvatarVoiceSettings'

    ConductorRequest:
      type: object
      additionalProperties: false
      required: [graph]
      properties:
        graph:
          $ref: '#/components/schemas/ConductorGraph'
        speakAfterS:
          type: number
          format: double
          nullable: true
          minimum: 0.1
          maximum: 10
          description: |
            Seconds after an avatar turn before the avatar speaks again along
            a `speak` edge, if the user has not taken the floor. 0.1 to 10;
            absent or null: Causeur's default (0.5 today).

    Conductor:
      type: object
      required: [avatarId, graph, nodes, edges]
      properties:
        avatarId:
          type: string
          format: uuid
        graph:
          $ref: '#/components/schemas/ConductorGraph'
        speakAfterS:
          type: number
          format: double
          description: As set; absent when it was not (Causeur's default applies, 0.5 today).
        nodes:
          type: integer
          description: The graph's node count.
        edges:
          type: integer
          description: The graph's edge count, all nodes together.

    ConductorSummary:
      type: object
      additionalProperties: false
      required: [configured]
      properties:
        configured:
          type: boolean
          description: Whether a conductor is set (`PUT /conductor`).
        nodes:
          type: integer
          description: Its node count, when one is set. `GET /conductor` returns the graph.

    ConductorGraph:
      type: object
      required: [start, nodes]
      description: |
        The steps of the conversation (`nodes`) and the one it starts in
        (`start`). Every node must be reachable from `start`. Only `start`,
        `nodes` and `reasoning` are accepted.
      properties:
        start:
          type: string
          description: The id of the node the conversation starts in.
        nodes:
          type: array
          description: 1 to 100 nodes; at most 100 edges in all.
          items:
            $ref: '#/components/schemas/ConductorNode'
        reasoning:
          nullable: true
          description: Optional free notes on the plan (any JSON); not used by the conductor.

    ConductorNode:
      type: object
      required: [id]
      description: |
        A step. Only the fields below are accepted. Text must not hold a
        `!<...>!` placeholder or start with `supabase/`.
      properties:
        id:
          type: string
          description: '`[a-z][a-z0-9_]{0,39}` (lowercase letters, digits and _, starting with a letter, at most 40), unique, not `none`.'
        instructions:
          type: string
          description: |
            What the avatar does while the conversation is in this step, at
            most 1000 characters. Empty or absent for a step that only
            chooses between others.
        edges:
          type: array
          description: |
            Where the conversation may go from this step, this step itself
            included (an edge back to it keeps the conversation here). No
            edges: the step is the end. At most one edge with a condition
            and one without per target.
          items:
            $ref: '#/components/schemas/ConductorEdge'
        random:
          type: boolean
          description: Draw the edge by the probabilities instead of taking the likeliest. Default false.
        emotion:
          type: string
          nullable: true
          description: |
            The avatar's feeling while in this step, one of: neutral, calm,
            thoughtful, curious, amused, playful, warm, happy, excited,
            proud, grateful, relieved, hopeful, impressed, determined,
            surprised, confused, skeptical, embarrassed, shy, apologetic,
            nervous, afraid, worried, sympathetic, sad, disappointed, tired,
            bored, frustrated, annoyed, angry, disgusted. Absent, empty or
            null leaves it to the conversation.
        role_play:
          type: boolean
          description: In this step the avatar may play someone else, in part or whole (a character in a scene it acts out). Default false.
        languages:
          type: array
          nullable: true
          description: The languages the avatar is expected to speak in this step, as distinct ISO 639-1 codes (two lowercase letters), at least one.
          items:
            type: string
        replan:
          type: boolean
          description: Must be false or absent here (the graph runs as given; the model never rewrites it).

    ConductorEdge:
      type: object
      required: [to]
      description: An edge, with a condition (`when`) or a weight. Only the fields below are accepted.
      properties:
        to:
          type: string
          description: The id of the node it leads to.
        when:
          type: string
          nullable: true
          description: |
            The condition the judge checks at the end of every turn, at most
            300 characters (e.g. "The user has said why they came.").
            Absent, null or blank: an edge without a condition.
        weight:
          type: number
          format: double
          description: |
            Only on an edge without a condition: its share of the
            probability that no condition holds, above 0 and at most 1000.
            Default 1.
        speak:
          type: boolean
          description: |
            Taken at the end of an avatar turn, the avatar goes on at once
            under the step it leads to, which must have instructions.
            Default false.

    BlackoutRecovery:
      type: object
      nullable: true
      additionalProperties: false
      description: |
        Blackout recovery of the v2 renderer. While the avatar listens, it
        screens each generated chunk for a fade to black (or fully black
        frames) and shows a healthy listening clip in place of a failed one,
        returning to live frames on the first healthy chunk. On by default.
        Send only the settings to change; an absent or null one keeps its
        current value (on create: its default). Ignored for v1 avatars (the
        setting exists only on the v2 renderer): nothing is stored and the
        rest of the request behaves as without it. It changes how sessions
        render, never the avatar's build: no candidate is captured or
        cancelled. A change applies from the next session.
      properties:
        enabled:
          type: boolean
          nullable: true
          description: Turn recovery on or off. Default true.
        detection:
          type: string
          nullable: true
          enum: [tiles, regions, both]
          description: |
            How a fade is detected. `tiles` (default, recommended) compares an
            8x8 grid of tiles over the whole frame with the recent healthy
            frames and fires when three quarters of the lit tiles darken
            together; dark hair, fur or clothes do not set it off. `regions`
            compares four fixed boxes (face, chest, two torso boxes) and
            fires when two of them darken together. `both` runs the two and
            fires when either does.
        tileThreshold:
          type: number
          format: double
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          maximum: 1
          exclusiveMaximum: true
          description: |
            The tile screen's threshold (`tiles`, `both`): how far, as a
            fraction of the reference brightness, the tiles must darken for
            three frames in a row before a chunk counts as fading. Lower is
            more sensitive (catches shallower fades, and more false alarms).
            Strictly between 0 and 1; default 0.40.
        regionThreshold:
          type: number
          format: double
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          maximum: 1
          exclusiveMaximum: true
          description: |
            The region screen's threshold (`regions`, `both`), read the same
            way. Strictly between 0 and 1; default 0.20.

    RuntimeSeed:
      type: integer
      nullable: true
      minimum: 0
      maximum: 2147483647
      description: |
        The v2 renderer's runtime seed: it seeds a session's noise and motion
        after the first chunk, so another seed gives the same avatar
        different movement; the serving candidate stays the same. Default 42
        (the renderer default; send 42 to go back to it). Absent or null
        keeps the current value (on create: the default). Ignored for v1
        avatars: nothing is stored and the rest of the request behaves as
        without it. It is no build input: nothing is captured or rebuilt,
        and a change applies from the next session.

    RenderResolution:
      type: object
      nullable: true
      additionalProperties: false
      required: [width, height]
      description: |
        A frame size in pixels for the v2 renderer: width and height are each
        a multiple of 32 from 256 to 1024, and width x height is at most
        262,144 (512 x 512); a larger frame is `400 invalid_manifest` on an
        avatar, `400 invalid_input` on a clip. Default 512 x 512 (square).
        Common shapes: square 512 x 512, portrait 384 x 672, landscape
        672 x 384. A deployment offers only some sizes (512 x 512 always;
        `GET /v1/account` `pricing.generation.clipResolutions` lists them
        where clips are offered): another is `400 invalid_input` ("resolution
        WxH is not offered; offered: ..."). On an avatar it is a build input of v2 avatars only
        (`400 invalid_input` for a v1 avatar): the portrait is preprocessed
        at that size, so a change on PATCH builds a new version with new
        candidates, like a new portrait; sending the current size again
        builds nothing. Absent or null keeps the current size (on create:
        the default).
      properties:
        width:
          type: integer
          minimum: 256
          maximum: 1024
          multipleOf: 32
        height:
          type: integer
          minimum: 256
          maximum: 1024
          multipleOf: 32

    BlackoutRecoveryEffective:
      type: object
      additionalProperties: false
      required: [enabled, detection, tileThreshold, regionThreshold]
      properties:
        enabled:
          type: boolean
        detection:
          type: string
          enum: [tiles, regions, both]
        tileThreshold:
          type: number
          format: double
        regionThreshold:
          type: number
          format: double

    AvatarSponsor:
      type: object
      required: [balance, settings]
      properties:
        balance:
          type: object
          required: [totalMicrocredits, planSourcedMicrocredits, topupSourcedMicrocredits, couponSourcedMicrocredits]
          properties:
            totalMicrocredits:
              type: integer
              description: planSourced + topupSourced + couponSourced.
            planSourcedMicrocredits:
              type: integer
            topupSourcedMicrocredits:
              type: integer
            couponSourcedMicrocredits:
              type: integer
              description: Credits granted from the account's coupon bucket.
        settings:
          type: object
          properties:
            maxPerSessionMicrocredits:
              type: integer
              nullable: true
            exhaustedBehavior:
              type: string
              enum: [pause, spend_balance]
            autoTopupEnabled:
              type: boolean
            autoTopupThresholdMicrocredits:
              type: integer
              nullable: true
            autoTopupAmountMicrocredits:
              type: integer
              nullable: true
            anonymousAccess:
              type: boolean
            anonymousDailySecondsPerVisitor:
              type: integer
              nullable: true

    AccountBalance:
      type: object
      required: [wallet, spendableMicrocredits, planMicrocredits, topupMicrocredits, couponMicrocredits, couponSpendable, heldByLiveSessionsMicrocredits, unlimited, nextExpiry]
      properties:
        wallet:
          type: string
          enum: [direct]
          description: The wallet API usage spends; always `direct`.
        spendableMicrocredits:
          type: integer
          format: int64
          description: What a session is admitted on for this caller (see the operation).
        planMicrocredits:
          type: integer
          format: int64
          description: Credits of the plan's cycle grant left. Negative when the bucket is in debt.
        topupMicrocredits:
          type: integer
          format: int64
          description: Purchased credits left.
        couponMicrocredits:
          type: integer
          format: int64
          description: Coupon credits left.
        couponSpendable:
          type: boolean
          description: False for a metered key, which never spends coupon credits.
        heldByLiveSessionsMicrocredits:
          type: integer
          format: int64
          description: Reserved by sessions running now (already taken out of the buckets); what they do not use comes back when they end.
        unlimited:
          type: boolean
          description: Sessions are not charged (an unlimited plan, or billing switched off).
        nextExpiry:
          type: array
          description: Credits that will expire, soonest first.
          items:
            $ref: '#/components/schemas/CreditExpiry'

    CreditExpiry:
      type: object
      required: [bucket, amountMicrocredits, expiresAt]
      properties:
        bucket:
          type: string
          description: PLAN, TOPUP or COUPON.
        amountMicrocredits:
          type: integer
          format: int64
        expiresAt:
          type: string
          format: date-time

    Account:
      type: object
      required: [accountId, plan, limits, pricing, captureQuota]
      properties:
        accountId:
          type: string
        plan:
          $ref: '#/components/schemas/AccountPlan'
        limits:
          $ref: '#/components/schemas/AccountLimits'
        pricing:
          $ref: '#/components/schemas/AccountPricing'
        captureQuota:
          $ref: '#/components/schemas/CaptureQuota'
        payouts:
          $ref: '#/components/schemas/AccountPayouts'
        links:
          $ref: '#/components/schemas/AccountLinks'
        v2Access:
          type: string
          enum: [granted, invite_required, unavailable]
          description: |
            Whether this account may build v2 avatars (`engine: v2`).
            `granted`: it may. `invite_required`: v2 is invite-only for now
            and this account has not been let in; v2 creates, candidates,
            versions, the conductor and v2 rebuilds answer 403
            `v2_access_required` until it redeems an invite code in Creator
            Studio (`links.billing`). Use `engine: v1` meanwhile.
            `unavailable`: v2 is not offered on this server. Absent when it
            could not be determined.

    AccountLinks:
      type: object
      required: [explore, avatars, create, billing, apiKeys, analytics, docs]
      description: |
        The account's pages on the Atmee website, ready to hand to a person.
        Absent when this deployment does not know the website's address.
      properties:
        explore:
          type: string
          format: uri
          description: Explore, where people find avatars to talk to.
        avatars:
          type: string
          format: uri
          description: The account's avatars in Creator Studio.
        create:
          type: string
          format: uri
          description: Make an avatar in Creator Studio.
        billing:
          type: string
          format: uri
          description: Credits, plan, top-ups and earnings.
        apiKeys:
          type: string
          format: uri
          description: The account's API keys.
        analytics:
          type: string
          format: uri
          description: Conversation analytics.
        docs:
          type: string
          format: uri
          description: The Avatar API documentation.

    SessionLinks:
      type: object
      required: [chat]
      description: |
        Absent when this deployment does not know the website's address.
      properties:
        chat:
          type: string
          format: uri
          description: |
            The avatar's chat page on the Atmee website (in the session's
            `language` when one was asked for). The session's own room is
            for the client that started it; this is the link for a person
            who only wants to talk to the avatar, and needs no session.

    AvatarLinks:
      type: object
      required: [chat, profile, studio]
      description: |
        The avatar's pages on the Atmee website, ready to hand to a person:
        give these rather than building URLs. Absent when this deployment
        does not know the website's address. A private avatar's pages open
        only for its owner, signed in.
      properties:
        chat:
          type: string
          format: uri
          description: |
            Its chat page, where anyone it is shared with talks to it; no
            session or token needed. On an avatar's detail it carries
            `?lang=` with the avatar's language, so the call is in it. This
            is the link for a person who wants to talk to the avatar, not a
            session's LiveKit room.
        profile:
          type: string
          format: uri
          description: Its public profile.
        studio:
          type: string
          format: uri
          description: Its edit page in Creator Studio.

    AccountPayouts:
      type: object
      required: [status]
      description: |
        Whether the account can be paid out (its Stripe Connect payout
        account), as last synced from Stripe. Monetizing an avatar needs
        `verified`; payouts are set up in Creator Studio. Absent when the
        database does not report it.
      properties:
        status:
          type: string
          enum: [not_started, unverified, pending, verified, suspended]
          description: not_started until a payout account exists, then its verification status.
        verifiedAt:
          type: string
          format: date-time
          nullable: true

    AccountPlan:
      type: object
      properties:
        code:
          type: string
          nullable: true
          description: The plan's code (e.g. free, pro).
        name:
          type: string
          nullable: true
        includedMicrocredits:
          type: integer
          format: int64
          nullable: true
          description: Credits the plan grants each cycle.
        cycleEnd:
          type: string
          format: date-time
          nullable: true
          description: When the current billing cycle ends.
        pendingPlan:
          $ref: '#/components/schemas/PlanRef'

    PlanRef:
      type: object
      nullable: true
      description: The plan the account moves to at the end of the cycle; absent when none is scheduled.
      properties:
        code:
          type: string
          nullable: true
        name:
          type: string
          nullable: true

    AccountLimits:
      type: object
      required: [apiAccess]
      properties:
        apiAccess:
          type: boolean
          description: Whether the account may use the API (sessions answer `403 api_access_disabled` when false).
        maxSessionSeconds:
          type: integer
          nullable: true
          description: Longest session the plan allows; absent = not capped by the plan.
        maxConcurrentSessions:
          type: integer
          nullable: true
          description: Sessions that may run at once; absent = not capped by the plan.
        maxApiAvatars:
          type: integer
          nullable: true
          description: Live API-created avatars the account may have.

    AccountPricing:
      type: object
      required: [sessionPerMinuteMicrocredits, monetizedPerMinuteMicrocredits, renderV1PerMinuteMicrocredits, renderV2PerMinuteMicrocredits, previewClipMicrocredits]
      properties:
        sessionPerMinuteMicrocredits:
          type: integer
          description: A conversation (`POST /v1/session`) per minute.
        monetizedPerMinuteMicrocredits:
          type: integer
          description: A minute with a monetized avatar on atmee.ai; API sessions are never charged it.
        renderV1PerMinuteMicrocredits:
          type: integer
          description: An avatar session of a v1 avatar per minute.
        renderV2PerMinuteMicrocredits:
          type: integer
          description: An avatar session of a v2 avatar per minute.
        previewClipMicrocredits:
          type: integer
          description: One preview clip.
        speechPerMinuteMicrocredits:
          type: integer
          nullable: true
          description: A speech session (`POST /v1/speech_sessions`) per minute; null on a deployment that does not report it.
        generation:
          $ref: '#/components/schemas/GenerationPricing'

    GenerationPricing:
      type: object
      description: The price of one call of each generation operation, charged only when at least one output comes back. Absent when this instance does not offer generation.
      required: [portraitsMicrocredits, enhancementsMicrocredits, voicesMicrocredits]
      properties:
        portraitsMicrocredits:
          type: integer
          description: One `POST /v1/generation/portraits` call.
        enhancementsMicrocredits:
          type: integer
          description: One `POST /v1/generation/enhancements` call.
        voicesMicrocredits:
          type: integer
          description: One `POST /v1/generation/voices` call.
        clipPerSecondMicrocredits:
          type: integer
          description: One second of a `POST /v1/generation/clips` clip (a clip costs this times its `durationSeconds`). Absent where clips are not offered.
        clipResolutions:
          type: array
          items:
            $ref: '#/components/schemas/RenderResolution'
          description: The frame sizes offered, for clips and v2 avatars alike, 512 x 512 first; another is `400 invalid_input`. Absent where clips are not offered, or where every size the rule allows is offered.

    CaptureQuota:
      type: object
      required: [pending, pendingLimit]
      description: v2 captures queued or running, against the pending cap (as X-RateLimit-* on a v2 create).
      properties:
        pending:
          type: integer
        pendingLimit:
          type: integer

    ApiKey:
      type: object
      description: An API key's settings. The secret is never part of it.
      required: [id, name, keyPrefix, lastFour, scopes, active, maxConcurrentSessions, spendCapMicrocredits, spendCapWindow, visitorMemory, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        keyPrefix:
          type: string
          description: The secret's first characters (`sk_atmee_` and 8 more), enough to recognise it, far too few to use it.
          examples:
            - sk_atmee_b395e328
        lastFour:
          type: string
          description: The secret's last four characters.
        scopes:
          type: array
          items:
            type: string
            enum: [sessions, "avatars:read", "avatars:write", "billing:write", "generation:write"]
        avatarId:
          type: string
          format: uuid
          description: The one avatar the key may use; absent for a key that may use every avatar of the account.
        active:
          type: boolean
          description: false once revoked.
        revokedAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        maxSessionSeconds:
          type: integer
          description: The longest session the key may start; absent for a key with no cap of its own (a metered key), where the plan's applies.
        maxConcurrentSessions:
          type: integer
        spendCapMicrocredits:
          type: integer
          description: What the key may spend per `spendCapWindow` (100 microcredits = 1 credit).
        spendCapWindow:
          type: string
          enum: [daily, monthly, total]
        visitorMemory:
          type: boolean
          description: Whether sessions started with this key may remember a visitor across sessions (`visitorId`).
        createdAt:
          type: string
          format: date-time
    ApiKeyList:
      type: object
      required: [apiKeys]
      properties:
        apiKeys:
          type: array
          items:
            $ref: '#/components/schemas/ApiKey'
    ApiKeyCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: A name to recognise the key by, e.g. the app that uses it.
        scopes:
          type: array
          nullable: true
          maxItems: 5
          items:
            type: string
            enum: [sessions, "avatars:read", "avatars:write", "billing:write", "generation:write"]
          description: |
            What the key may do; `sessions` (start and end conversations) is
            always included. `avatars:read` / `avatars:write` manage avatars,
            `billing:write` moves credits into sponsor pools, `generation:write`
            spends credits on portrait and voice generation (together with
            `avatars:write`). Default: just `sessions`.
        avatarId:
          type: string
          nullable: true
          format: uuid
          description: Restrict the key to this one avatar of the account.
        maxSessionSeconds:
          type: integer
          nullable: true
          minimum: 30
          maximum: 14400
        maxConcurrentSessions:
          type: integer
          nullable: true
          minimum: 1
          maximum: 100
        spendCapMicrocredits:
          type: integer
          nullable: true
          minimum: 1
          description: Default 50000 (500 credits).
        spendCapWindow:
          type: string
          nullable: true
          enum: [daily, monthly, total]
          description: Default monthly.
        visitorMemory:
          type: boolean
          nullable: true
          description: Allow cross-session visitor memory (`visitorId` on session start). Default false.
    ApiKeySecret:
      type: object
      required: [apiKey, key]
      properties:
        apiKey:
          type: string
          description: The secret (`sk_atmee_...`). Shown only in this response; store it at once.
        key:
          $ref: '#/components/schemas/ApiKey'
    CurrentCaller:
      type: object
      required: [kind, accountId]
      description: |
        `kind: api_key` carries every field but `userId`; `kind: user` carries
        only `kind`, `userId` and `accountId`.
      properties:
        kind:
          type: string
          enum: [api_key, user]
        accountId:
          type: string
        userId:
          type: string
          description: Only for kind user.
        id:
          type: string
          description: The key's id (kind api_key).
        name:
          type: string
          nullable: true
        scopes:
          type: array
          items:
            type: string
        avatarId:
          type: string
          nullable: true
          description: The one avatar an avatar-scoped key may use; absent for an account-wide key.
        billingMode:
          type: string
          description: reserve or metered.
        active:
          type: boolean
        spendCap:
          $ref: '#/components/schemas/ApiKeySpendCap'
        maxSessionSeconds:
          type: integer
          nullable: true
          description: The key's own cap on a session's length; absent = the plan's.
        maxConcurrentSessions:
          type: integer
          nullable: true
          description: The key's own cap on sessions at once; absent = the plan's.

    ApiKeySpendCap:
      type: object
      required: [window, spentMicrocredits, enforced]
      properties:
        limitMicrocredits:
          type: integer
          format: int64
          nullable: true
          description: The cap; absent when the key has none.
        window:
          type: string
          description: daily, monthly or total.
        spentMicrocredits:
          type: integer
          format: int64
          description: What the key's sessions have used in the current window, as the cap counts it.
        remainingMicrocredits:
          type: integer
          format: int64
          nullable: true
          description: limit - spent, floored at 0; absent when the key has no cap.
        windowResetsAt:
          type: string
          format: date-time
          nullable: true
          description: When the window starts over; absent for a total cap.
        enforced:
          type: boolean
          description: False when the cap is not applied (an unlimited plan, or billing switched off).

    AvatarSponsorPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        maxPerSessionMicrocredits:
          type: integer
          nullable: true
          minimum: 1
          description: null clears the cap.
        exhaustedBehavior:
          type: string
          nullable: true
          enum: [pause, spend_balance]
        autoTopupEnabled:
          type: boolean
          nullable: true
        autoTopupThresholdMicrocredits:
          type: integer
          nullable: true
          minimum: 1
        autoTopupAmountMicrocredits:
          type: integer
          nullable: true
          minimum: 1
        anonymousAccess:
          type: boolean
          nullable: true
        anonymousDailySecondsPerVisitor:
          type: integer
          nullable: true
          minimum: 1
          description: null clears the per-visitor daily cap.

    SponsorGrantRequest:
      type: object
      required: [microcredits]
      properties:
        microcredits:
          type: integer
          minimum: 1

    SponsorGrantResponse:
      type: object
      required: [transferredMicrocredits, replayed]
      properties:
        transferredMicrocredits:
          type: integer
        replayed:
          type: boolean
          description: True when an earlier request with the same Idempotency-Key was replayed.
        error:
          type: string
          nullable: true
          description: |
            Only on `POST /v1/avatars`: the avatar was created but the manifest's funding was
            refused (e.g. `Insufficient balance`, `free_plan_credits_cannot_sponsor`). Fund it
            later via `/sponsor/grants`. Absent when the grant succeeded.

    SponsorWithdrawRequest:
      type: object
      properties:
        microcredits:
          type: integer
          nullable: true
          minimum: 1
          description: Omit to withdraw everything that is not reserved by a running session.

    SponsorWithdrawResponse:
      type: object
      required: [withdrawnMicrocredits]
      properties:
        withdrawnMicrocredits:
          type: integer

    AvatarSessionCreateRequest:
      type: object
      properties:
        livekitUrl:
          type: string
          nullable: true
          maxLength: 512
          description: |
            Your LiveKit server URL (`wss://<project>.livekit.cloud`, or a
            self-hosted `ws(s)://` address). Omit together with `livekitToken`
            for an Atmee-hosted room.
          examples:
            - "wss://my-project-abc123.livekit.cloud"
        livekitToken:
          type: string
          nullable: true
          minLength: 16
          maxLength: 8192
          description: |
            LiveKit access token for the avatar participant, minted with YOUR
            project's API key and secret: `identity` = the avatar's participant
            identity (the plugin uses `atmee-avatar-agent`), `kind: agent`, a
            `roomJoin` grant for your room, and the attribute
            `lk.publish_on_behalf` = your agent's identity. Read, never verified,
            by this service. Omit together with `livekitUrl` for an Atmee-hosted
            room.
        agentIdentity:
          type: string
          nullable: true
          maxLength: 256
          description: |
            With your own room: optional cross-check, must equal the token's
            `lk.publish_on_behalf`. In an Atmee-hosted room: your agent's
            participant identity (default `agent`; `atmee-avatar-agent` is
            reserved for the avatar).
        maxDurationSeconds:
          type: integer
          nullable: true
          minimum: 60
          maximum: 14400
          description: |
            Hard ceiling of the session, in seconds (default 3600). Also the most
            a session can bill if your agent dies without the worker ever
            reporting. Capped server-side by the key's limits.
        metadata:
          type: object
          nullable: true
          additionalProperties: true
          maxProperties: 50
          description: Optional free-form metadata to attach to the session (stored as JSONB).

    AvatarSessionStartRequest:
      description: The avatar to render, and the room to render it into.
      allOf:
        - type: object
          required: [avatarId]
          properties:
            avatarId:
              type: string
              format: uuid
              description: The avatar to render. Must be on the key's allow-list.
        - $ref: '#/components/schemas/AvatarSessionCreateRequest'

    AvatarSessionCreateResponse:
      type: object
      required: [sessionId, status, avatarParticipantIdentity, agentIdentity, roomName, maxDurationSeconds, billingMode]
      properties:
        sessionId:
          type: string
          format: uuid
        status:
          type: string
          enum: [initializing, avatar_joined]
          description: How far the start had progressed when this response was sent.
        avatarParticipantIdentity:
          type: string
          description: The identity the avatar joins the room with (from your token; `atmee-avatar-agent` in a hosted room).
        agentIdentity:
          type: string
          description: The agent the avatar renders for (the token's `lk.publish_on_behalf`, or the hosted room's agent).
        roomName:
          type: string
          description: The room, as granted by your token or created by Atmee.
        maxDurationSeconds:
          type: integer
          description: The hard ceiling applied to this session.
        billingMode:
          type: string
          enum: [reserve, metered]
        livekitUrl:
          type: string
          description: |
            Atmee-hosted room only: the LiveKit server (`wss://...`) your agent
            joins.
        agentToken:
          type: string
          description: |
            Atmee-hosted room only: the access token your agent joins the room
            with (identity `agentIdentity`, publish, subscribe and data). Valid
            for the session's ceiling plus the join timeout; treat it as a
            secret.

    AvatarSessionStatusResponse:
      type: object
      required: [sessionId, status]
      properties:
        sessionId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, active, completed, failed]
          description: |
            `pending` starting, `active` live, `completed` ran and ended
            normally (including an end you asked for), `failed` never really
            started (see `endReason` and `failureCode`).
        kind:
          type: string
          enum: [conversation, render]
          description: '`conversation` (POST /v1/session) or `render` (POST /v1/avatars/{avatarId}/avatar_sessions).'
        avatarJoinedAt:
          type: string
          format: date-time
          nullable: true
        agentJoinedAt:
          type: string
          format: date-time
          nullable: true
          description: When the worker saw your agent in the room; billing starts here.
        userJoinedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            When the visitor (a conversation) or your agent (a render) joined;
            null when nobody did. Billing runs from the later of this and
            `avatarJoinedAt`.
        endedAt:
          type: string
          format: date-time
          nullable: true
        endReason:
          type: string
          nullable: true
          enum: [user_left, agent_left, avatar_ended, avatar_removed, max_duration, ended_by_api, room_closed, balance_exhausted, no_user_joined, avatar_did_not_join, error]
          description: |
            Why the session ended; null while it is live. `user_left` the
            visitor left; `agent_left` your agent left (render); `avatar_ended`
            the avatar ended the call; `avatar_removed` you removed the avatar
            participant (render); `max_duration` the granted length ran out;
            `ended_by_api` you ended it; `room_closed` the room closed;
            `balance_exhausted` a metered session ran out of credits or hit
            the key's spend cap; `no_user_joined` nobody joined within the
            join window (60 s after the avatar); `avatar_did_not_join` the
            avatar never joined; `error` anything else (see `failureCode`).
        failureCode:
          type: string
          nullable: true
          description: The failure code of a `failed` session (e.g. `USER_DID_NOT_JOIN`, `AVATAR_DID_NOT_JOIN`); null otherwise.
        billingMode:
          type: string
          enum: [reserve, metered]
        billedSeconds:
          type: integer
          nullable: true
          description: |
            Seconds billed, as the database settled the session (the time
            both parties were in the room); null while it is live, or when
            the settlement cannot be read.
        chargedMicrocredits:
          type: integer
          nullable: true
          description: |
            What the session cost, once it ended, in microcredits (100 = 1
            credit), from the account's balance and the avatar's sponsor pool,
            as the database settled it; null while it is live, or when the
            settlement cannot be read.

    AvatarSessionEndResponse:
      type: object
      required: [sessionId, status, alreadyEnded]
      properties:
        sessionId:
          type: string
          format: uuid
        status:
          type: string
          enum: [completed, failed]
        endedAt:
          type: string
          format: date-time
          nullable: true
        alreadyEnded:
          type: boolean
          description: True when the session was already terminal before this call.
        endReason:
          type: string
          nullable: true
          description: |
            Why the session ended: `ended_by_api` for this call, or the
            earlier reason when it had already ended (see
            AvatarSessionStatusResponse.endReason).

    AvatarSessionEndedCallback:
      type: object
      required: [session_id, reason]
      properties:
        session_id:
          type: string
          format: uuid
        ended_at:
          type: string
          nullable: true
          description: ISO-8601 timestamp of the end as seen by the worker (informational).
        reason:
          type: string
          maxLength: 64
          description: '`rendering` (liveness tick) | `agent_left` | `room_closed` | `removed` | `error` | `backstop`'
        detail:
          type: string
          nullable: true
          maxLength: 1000
        at:
          type: string
          nullable: true
          description: ISO-8601 timestamp of a liveness tick (informational).

    SpeechSessionCreateRequest:
      type: object
      additionalProperties: false
      required: [avatarId]
      properties:
        avatarId:
          type: string
          format: uuid
          description: An avatar of this account, with a voice, whose persona and voice the session uses (an avatar-scoped key's own avatar).
        maxDurationSeconds:
          type: integer
          nullable: true
          minimum: 60
          maximum: 3600
          description: The session's length in seconds (default 600), counted from the reservation (this call), whenever the connection opens. Shortened when the balance or the plan allows less; the answer says what was granted (`actualDurationSeconds`).
        language:
          type: string
          nullable: true
          minLength: 2
          maxLength: 35
          pattern: '^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$'
          description: BCP 47 language of the conversation (e.g. `en`, `fr-FR`); passed to the speech server as given.
        settings:
          nullable: true
          description: '`session.start` fields pinned by your backend: the client cannot set them (see the operation).'
          allOf:
            - $ref: '#/components/schemas/SpeechSessionPinnedSettings'

    SpeechSessionPinnedSettings:
      type: object
      additionalProperties: false
      description: |
        The `session.start` fields a developer may pin, with the speech
        server's limits for them (a violation answers `422
        invalid_settings`, naming the field). A null field pins nothing.
        Counted in characters (Unicode code points).
      properties:
        instructions:
          type: string
          nullable: true
          description: At most 8,000 characters, together with the text of the `developer` items of `input`.
        persona:
          type: string
          nullable: true
          description: At most 4,000 characters; overrides the avatar's.
        facts:
          type: string
          nullable: true
          description: At most 4,000 characters; overrides the avatar's.
        scenario:
          type: string
          nullable: true
          description: At most 4,000 characters.
        agenda:
          type: string
          nullable: true
          description: At most 4,000 characters.
        directive:
          type: string
          nullable: true
          description: At most 4,000 characters.
        avatar_name:
          type: string
          nullable: true
          description: At most 4,000 characters; overrides the avatar's.
        user_name:
          type: string
          nullable: true
          description: At most 4,000 characters.
        self_introduction:
          type: string
          nullable: true
          description: At most 4,000 characters; overrides the avatar's.
        input:
          type: array
          nullable: true
          description: |-
            The starting history, at most 50 items and 32,000 characters of text in all. Each item's `role` is `user`, `assistant` or `developer`, and each part of its `content` is `{"type": "input_text", "text": ...}` (`output_text` in an `assistant` item).
          items:
            type: object
            properties:
              role:
                type: string
              content:
                type: array
                items:
                  type: object
                  properties:
                    text:
                      type: string
        delegation:
          type: object
          nullable: true
          additionalProperties: false
          properties:
            type:
              type: string
              enum: [responses]
            responses:
              type: object
              nullable: true
              additionalProperties: false
              properties:
                instructions:
                  type: string
                  nullable: true
                  description: At most 4,000 characters.
                tools:
                  type: array
                  nullable: true
                  description: At most 32 named functions (unique names), 24,576 bytes of JSON in all.
                  items:
                    type: object
                    additionalProperties: true
                tool_choice:
                  description: '`auto`, `none`, `required` (needs tools) or `{"type": "function", "name": ...}` naming one of the tools.'
        avatar_timezone:
          type: string
          nullable: true
          description: An IANA time zone name (e.g. `Europe/Paris`).
        user_timezone:
          type: string
          nullable: true
          description: An IANA time zone name.

    SpeechSessionCreateResponse:
      type: object
      required: [sessionId, url, token, tokenExpiresAt, actualDurationSeconds, durationCapped, billingMode]
      properties:
        links:
          allOf:
            - $ref: '#/components/schemas/SessionLinks'
        sessionId:
          type: string
          format: uuid
        url:
          type: string
          description: The WebSocket URL to connect to (`wss://...`).
        token:
          type: string
          description: Admits one connection to this session; valid for 60 seconds. Not a credential for anything else.
        tokenExpiresAt:
          type: string
          format: date-time
        actualDurationSeconds:
          type: integer
          description: The length granted by the key's, the plan's and the balance's limits, counted from the reservation (this call), whenever the connection opens; the session ends at the reservation plus this many seconds (`endsAt` on GET).
        requestedDurationSeconds:
          type: integer
          description: The `maxDurationSeconds` you sent; omitted when you sent none.
        durationCapped:
          type: boolean
          description: True when `actualDurationSeconds` is shorter than `requestedDurationSeconds`.
        billingMode:
          type: string
          enum: [reserve, metered]

    SpeechSessionStatusResponse:
      type: object
      required: [sessionId, status, actualDurationSeconds, endsAt, billingMode]
      properties:
        sessionId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, active, completed, failed]
        avatarId:
          type: string
          format: uuid
          nullable: true
        language:
          type: string
          nullable: true
        actualDurationSeconds:
          type: integer
          description: The length granted.
        createdAt:
          type: string
          format: date-time
          nullable: true
        connectedAt:
          type: string
          format: date-time
          nullable: true
          description: When billing started (the speech server's first usage report); null until then.
        endsAt:
          type: string
          format: date-time
          description: When the session's time runs out (the reservation plus `actualDurationSeconds`).
        endRequestedAt:
          type: string
          format: date-time
          nullable: true
          description: When you ended the session while a connection was open; it settles at the connection's next usage report (within 30 s).
        endedAt:
          type: string
          format: date-time
          nullable: true
        endReason:
          type: string
          nullable: true
          description: Why it ended (`user_left`, `max_duration`, `balance_exhausted`, `ended_by_api`, `error`, ...; see AvatarSessionStatusResponse.endReason); null while it is live.
        failureCode:
          type: string
          nullable: true
        billingMode:
          type: string
          enum: [reserve, metered]
        billedSeconds:
          type: integer
          nullable: true
        chargedMicrocredits:
          type: integer
          nullable: true

    SpeechSessionPersona:
      type: object
      description: The avatar's persona; a field the avatar leaves empty is omitted.
      required: [avatar_name]
      properties:
        avatar_name:
          type: string
        persona:
          type: string
        facts:
          type: string
        self_introduction:
          type: string

    SpeechSessionSettings:
      type: object
      required: [sessionId, accountId, maxDurationSeconds, endsAt, voice, language, persona, settings]
      properties:
        sessionId:
          type: string
          format: uuid
        accountId:
          type: string
        maxDurationSeconds:
          type: integer
        endsAt:
          type: string
          format: date-time
        voice:
          type: string
          nullable: true
          description: The avatar's voice, a Fish reference ID (`^[A-Za-z0-9_-]{1,128}$`); null only when the avatar lost its voice after the start (refuse the session).
        language:
          type: string
          nullable: true
        persona:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SpeechSessionPersona'
        settings:
          type: object
          additionalProperties: true
          description: The developer's pinned `session.start` fields (`SpeechSessionPinnedSettings`, null fields left out); `{}` when none. Applied over the client's and over `persona`.

    SpeechUsage:
      type: object
      description: What the session used, as the live server counted it (best effort).
      properties:
        inputAudioSeconds:
          type: number
          nullable: true
          minimum: 0
        outputAudioSeconds:
          type: number
          nullable: true
          minimum: 0
        llmInputTokens:
          type: number
          nullable: true
          minimum: 0
        llmOutputTokens:
          type: number
          nullable: true
          minimum: 0
        ttsCharacters:
          type: number
          nullable: true
          minimum: 0
        judgeCalls:
          type: number
          nullable: true
          minimum: 0

    SpeechSessionTickRequest:
      type: object
      required: [elapsedSeconds]
      properties:
        elapsedSeconds:
          type: integer
          minimum: 0
          description: Seconds since the connection was set up.
        usage:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SpeechUsage'

    SpeechSessionTickResponse:
      type: object
      required: [continue]
      properties:
        continue:
          type: boolean
        reason:
          type: string
          nullable: true
          description: Why not, when `continue` is false (`max_duration`, `balance_exhausted`, `ended_by_caller`, `ended`).

    SpeechSessionEndedRequest:
      type: object
      required: [reason, elapsedSeconds]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 64
        elapsedSeconds:
          type: integer
          minimum: 0
        usage:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SpeechUsage'

    SpeechSessionEndResponse:
      type: object
      required: [sessionId, status, alreadyEnded]
      properties:
        sessionId:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, completed, failed]
          description: '`active` when a connection is open: the end is requested (`endRequestedAt`) and settles at its next usage report.'
        alreadyEnded:
          type: boolean
          description: True when the session was settled before this call.
        endRequestedAt:
          type: string
          format: date-time
          nullable: true
          description: When the end was first requested, while a connection is open; null once settled at this call or before.
        endedAt:
          type: string
          format: date-time
          nullable: true
        endReason:
          type: string
          nullable: true

    SpeechSessionEndedResponse:
      type: object
      required: [sessionId, status, alreadyEnded]
      properties:
        sessionId:
          type: string
          format: uuid
        status:
          type: string
          enum: [completed, failed]
        alreadyEnded:
          type: boolean
        endReason:
          type: string
          nullable: true
