    get:
      tags: [Avatars]
      summary: The avatar's facts and knowledge files
      operationId: getAvatarKnowledge
      security:
        - apiKeyAuth: []
        - userToken: []
      responses:
        '200':
          description: The facts as set, the questionnaire's questions and answers, and the knowledge files, with presigned URLs.
          content:
            application/json:
