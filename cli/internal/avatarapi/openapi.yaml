          description: Where the Explore thumbnail comes from -- `custom` (uploaded, as with `PUT /v1/avatars/{avatarId}/thumbnail`) or `auto` (made for the avatar); null when it has none and Explore shows the portrait.

    AvatarSocialLink:
      type: object
