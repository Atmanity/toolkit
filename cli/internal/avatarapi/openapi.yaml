    TtsProvider:
      type: string
      enum: [chatterbox_v3, fish, fish_audio, elevenlabs]
      description: The voice engine (`voice.ttsProvider` on a v1 create); every v2 avatar speaks with fish_audio.

    AvatarVoiceSettings:
      type: object
      properties:
        ttsProvider:
          allOf:
            - $ref: '#/components/schemas/TtsProvider'
          nullable: true

    AvatarSourceFile:
      type: object
      properties:
        url:
          type: string
          nullable: true
