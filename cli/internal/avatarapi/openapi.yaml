              type: integer
              format: int64
            currentCycleMicrocredits:
              type: integer
              format: int64
            allTimeSessions:
              type: integer
              format: int64
              description: Sessions that earned.
            currentCycleSessions:
              type: integer
              format: int64

    AvatarProfile:
      type: object
      required: [tags, socialLinks, monetizationEnabled, verified]
      description: How the avatar is shown on its public page, as set in Creator Studio or by PATCH and the thumbnail route.
      properties:
        title:
