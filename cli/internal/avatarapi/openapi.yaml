              required: [files]
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                descriptions:
                  type: string
                  nullable: true
                  description: JSON object, filename -> description (<= 500 chars each).
          application/json:
            schema:
              $ref: '#/components/schemas/AvatarKnowledgeJsonRequest'
      responses:
        '200':
          description: Accepted; the affected build stages re-run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarPartResponse'
        '400':
          description: invalid_upload (also a JSON body on an instance without uploads, which takes multipart only) | invalid_manifest | invalid_url | fetch_failed | upload_not_found | upload_kind_mismatch
        '401':
          description: Missing or invalid API key -- or a user token that is invalid, anonymous, or of a user who may act for no account (invalid_login)
        '403':
          description: insufficient_scope | avatar_not_allowed | account_not_allowed (a user token whose X-Account-Id names an account the user may not act for)
        '404':
          description: avatar_not_found
        '409':
          description: upload_not_ready | upload_consumed | upload_expired | upload_in_use | account_ambiguous (a user token of several accounts without X-Account-Id)
        '413':
          description: Upload exceeds the size limit

