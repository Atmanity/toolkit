        '403':
          description: insufficient_scope | avatar_not_allowed | account_not_allowed
        '404':
          description: avatar_not_found
        '409':
          $ref: '#/components/responses/AccountAmbiguous'

  /v1/avatars/{avatarId}/thumbnail:
