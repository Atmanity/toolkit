      properties:
        type:
          type: string
        url:
          type: string

    AvatarStudioChoices:
      type: object
      description: |
        What was picked in Creator Studio's editor (read only here): how the
        portrait and the voice were made, and the persona presets the
        whoPrompt and whatPrompt texts started from. Null when never picked
        (an API avatar).
      properties:
        creationMethod:
          type: string
          nullable: true
          description: ai_generated, upload, capture or preset.
        voiceType:
          type: string
          nullable: true
          description: recording, upload, ai or pre_generated.
        whoAreYou:
          type: string
          nullable: true
          description: The personality preset.
        scenario:
          type: string
          nullable: true
          description: The scenario preset.

    AvatarKnowledgeFileLink:
      allOf:
        - $ref: '#/components/schemas/AvatarKnowledgeFile'
