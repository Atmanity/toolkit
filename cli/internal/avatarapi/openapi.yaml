  /v1/sessions/{session_id}:
    parameters:
      - name: session_id
        in: path
        required: true
        description: The session's id, as `POST /v1/sessions` returned it.
        schema:
          type: string
          format: uuid
    get:
      tags: [Session]
      summary: Read a session's state, end reason and cost
      description: |
        Reads a session started with an API key (`POST /v1/sessions` or `POST
        /v1/avatar_sessions`): the same read as `GET
        /v1/avatar_sessions/{id}`. A start returns how to join; this returns
        what happened and what it cost, and never the room credentials.

        `status` is `pending` (starting), `active` (live), `completed` (it
        ran and ended normally, including when you ended it) or `failed` (it
        never really started: nobody joined, the avatar did not join, or an
        error; nothing is billed for the time it did not run). Once it
        ended, `endReason` says why, `failureCode` names the failure of a
        failed session, and `billedSeconds` / `chargedMicrocredits` say what
        it cost (100 microcredits = 1 credit). Website and anonymous
        sessions are `404`.
      operationId: getSession
      security:
        - apiKeyAuth: []
        - userToken: []
      responses:
        '200':
          description: The session's durable state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarSessionStatusResponse'
        '401':
          description: Missing or invalid API key -- or a user token that is invalid, anonymous, or of a user who may act for no account (invalid_login)
        '403':
          description: '`forbidden` — the session belongs to another account | `avatar_not_allowed` — the session''s avatar is not on this key''s allow-list | account_not_allowed (a user token whose X-Account-Id names an account the user may not act for)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: '`not_found` — no such session, or not one started through the API (a website session)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          $ref: '#/components/responses/AccountAmbiguous'

  /v1/sessions/{session_id}/end:
    post:
      tags:
        - Session
      summary: End a conversation session
      description: |
        Ends a session started with `POST /v1/sessions` now: the room
        closes and the avatar leaves. End it with the credential that
        started it:

        - **API key** — a session your backend started. Billing stops; the
          session settles `completed` with `endReason: ended_by_api`,
          billed only for the time both the visitor and the avatar were in
          the room. **Idempotent**: ending one that already ended answers
          `200` with `alreadyEnded: true` (`AvatarSessionEndResponse`). Read
          its state and cost with `GET /v1/sessions/{id}`.
        - **Signed-in user** — a website session of the user's account.
          Ending one that already ended answers `409`
          (`ForceEndSessionResponse` on success).

        With both credentials, the API key's end applies.
      operationId: forceEndSession
      security:
        - apiKeyAuth: []
        - bearerAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          description: Session ID to forcefully end
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: |
            The session is ended (API key: or already was, `alreadyEnded`).
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/AvatarSessionEndResponse'
                  - $ref: '#/components/schemas/ForceEndSessionResponse'
        '401':
          description: A missing, invalid or revoked API key or bearer token.
        '403':
          description: |
            The session belongs to another account, or (API key) its avatar
            is not on the key's allow-list (`avatar_not_allowed`).
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ApiErrorResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            No such session. With an API key, also a website session of the
            account (not one started through the API).
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ApiErrorResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: (Signed-in user) the session has already ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            The `session_id` path parameter is not a valid UUID. Returned by
            the request-validation layer before the handler runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrameworkErrorResponse'
        '500':
          description: Internal server error (API key `finalize_failed`; retry).
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ApiErrorResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: |
            The room could not be closed from here right now (API key
            `session_unavailable`, retry after `Retry-After`; ending is
            idempotent), or the session is not managed by this process.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying (API key).
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ApiErrorResponse'
                  - $ref: '#/components/schemas/ErrorResponse'

